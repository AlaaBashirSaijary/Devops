<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello DevOps</title>
<style>
  :root { --bg:#0b1220; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --ok:#4ade80; --bad:#f87171; --tool:#38bdf8; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; }
  body { font-family:system-ui,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); overflow:hidden; }
  #scene { position:fixed; inset:0; }
  #scene canvas { display:block; width:100%; height:100%; touch-action:none; }
  header { position:fixed; inset-inline:0; top:0; display:flex; justify-content:space-between; align-items:center; gap:12px; padding:14px 18px; pointer-events:none; }
  header h1 { margin:0; font-size:20px; }
  header .hint { color:var(--muted); font-size:13px; }
  .badge { pointer-events:auto; background:rgba(30,41,59,.85); border:1px solid #334155; border-radius:999px; padding:4px 12px; font-size:13px; display:flex; gap:6px; align-items:center; backdrop-filter:blur(6px); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  #tools { position:fixed; inset-inline:0; bottom:0; display:flex; justify-content:center; gap:8px; padding:10px 12px 14px; flex-wrap:wrap; }
  #tools button { width:46px; height:46px; border-radius:12px; border:1px solid #334155; background:rgba(30,41,59,.85); display:grid; place-items:center; cursor:pointer; padding:0; backdrop-filter:blur(6px); transition:transform .15s, border-color .15s; }
  #tools button:hover, #tools button:focus-visible, #tools button.on { transform:translateY(-3px); border-color:var(--tool); outline:none; }
  #tools img { width:26px; height:26px; }
  #info { position:fixed; inset-inline:12px; bottom:78px; max-width:520px; max-height:calc(100vh - 150px); overflow:auto; margin-inline:auto; background:rgba(30,41,59,.97); border:1px solid var(--tool); border-radius:16px; padding:16px 18px; display:grid; grid-template-columns:64px 1fr; gap:6px 14px; box-shadow:0 10px 40px rgba(0,0,0,.5); animation:pop .18s ease-out; }
  #info[hidden] { display:none; }
  #info > * { grid-column:1 / -1; }
  #info .logo { grid-column:1; grid-row:1; width:64px; height:64px; border-radius:16px; background:#0b1220; border:2px solid var(--tool); display:grid; place-items:center; }
  #info .logo img { width:38px; height:38px; }
  #info .head { grid-column:2; grid-row:1; align-self:center; }
  #info b { display:block; font-size:20px; }
  #info .step { color:var(--tool); font-size:13px; font-weight:600; }
  #info p { margin:0; color:var(--text); font-size:14px; line-height:1.6; }
  #info h2 { margin:10px 0 0; font-size:13px; color:var(--tool); }
  #info ol { margin:0; padding:0; list-style:none; display:grid; gap:8px; }
  #info li span { display:block; color:var(--muted); font-size:13px; }
  #info li code { display:block; direction:ltr; text-align:left; white-space:pre-wrap; background:#0b1220; border-radius:8px; padding:6px 10px; font-size:12.5px; color:#e2e8f0; user-select:all; }
  #info .file { color:var(--muted); font-size:13px; }
  #info .file a { direction:ltr; unicode-bidi:embed; }
  #info .x { position:absolute; top:6px; inset-inline-end:10px; background:none; border:0; color:var(--muted); font-size:20px; cursor:pointer; }
  @media (max-width:520px) {
    #tools { gap:5px; padding-inline:6px; flex-wrap:nowrap; }
    #tools button { width:38px; height:38px; border-radius:10px; }
    #tools img { width:22px; height:22px; }
    #info { bottom:62px; max-height:calc(100vh - 130px); }
  }
  #deck-link { position:fixed; bottom:2px; inset-inline-start:12px; font-size:12px; }
  a { color:var(--accent); }
  @keyframes pop { from { transform:translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
</style>
</head>
<body>
<div id="scene" role="img" aria-label="مصنع ثلاثي الأبعاد: الكود يعبر أدوات DevOps الثمانية على سير ناقل. اضغط على أي أداة لمعرفة اسمها."></div>

<header>
  <div><h1>Hello DevOps</h1><span class="hint">اضغط على أي أداة، واسحب للتدوير</span></div>
  <div class="badge" title="البيئة"><span class="dot" id="dot"></span><span id="env">...</span></div>
</header>

<div id="info" hidden>
  <button class="x" id="close" aria-label="إغلاق">×</button>
  <div class="logo"><img id="i-logo" alt=""></div>
  <div class="head"><span class="step" id="i-step"></span><b id="i-name"></b></div>
  <p id="i-desc"></p>
  <h2>عمليًا في المشروع</h2>
  <ol id="i-steps"></ol>
  <h2>داخل خط الإنتاج</h2>
  <p id="i-ci"></p>
  <p class="file">الملف: <a id="i-file" target="_blank" rel="noopener"></a></p>
</div>

<nav id="tools" aria-label="أدوات DevOps"></nav>
<a id="deck-link" href="presentation/" hidden>العرض التقديمي ←</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  const REPO = 'https://github.com/AlaaBashirSaijary/Devops/blob/main/';
  const TOOLS = [
    { slug: 'github', name: 'GitHub Issues', ar: '١ · التخطيط', c: '#a78bfa',
      d: 'نكتب المهمة قبل الكود: Issue واحد لكل تغيير، وكل Issue له فرع خاص.',
      steps: [['افتح Issue من المتصفح', 'Issues ← New issue ← «إضافة مسار /health»'], ['أنشئ فرعًا للمهمة', 'git checkout -b feature/health']],
      file: 'README.md', ci: 'عند فتح Pull Request يشغّل GitHub الاختبارات تلقائيًا ويربطها بالـ Issue.' },
    { slug: 'git', name: 'Git', ar: '٢ · البرمجة', c: '#fb923c',
      d: 'نعدّل الكود في فرع منفصل ثم نرسله عبر Pull Request ليُراجَع قبل الدمج.',
      steps: [['احفظ التعديل', 'git add . && git commit -m "feat: add /health"'], ['ارفعه إلى GitHub', 'git push -u origin feature/health'], ['جرّب محليًا', 'npm start   # http://localhost:3000']],
      file: 'app/server.js', ci: 'الدمج في main هو الذي يُطلق خط الإنتاج كله.' },
    { slug: 'githubactions', name: 'GitHub Actions', ar: '٣ · الاختبار', c: '#facc15',
      d: 'روبوت على خوادم GitHub ينفّذ الخطوات نفسها عند كل Push دون تدخل منك.',
      steps: [['شغّل الاختبار محليًا', 'npm test   # 3 اختبارات'], ['أو شاهده على GitHub', 'تبويب Actions ← آخر run']],
      file: '.github/workflows/ci.yml', ci: 'الترتيب: test ← build-and-push ← staging ← live. إن فشلت خطوة يتوقف كل ما بعدها.' },
    { slug: 'docker', name: 'Docker', ar: '٤ · البناء', c: '#38bdf8',
      d: 'الصورة (Image) قالب جاهز للتطبيق ومكتباته. الحاوية (Container) نسخة تعمل من ذلك القالب. من صورة واحدة تشغّل حاويات كثيرة.',
      steps: [['١. Dockerfile يصف الصورة', 'FROM node:20-alpine\nCOPY app ./app\nCMD ["node","app/server.js"]'], ['٢. ابنِ الصورة', 'docker build -t hello-devops .'], ['٣. شغّل حاوية منها', 'docker run -p 3000:3000 hello-devops'], ['٤. شغّل حاوية ثانية من الصورة نفسها', 'docker run -p 3001:3000 hello-devops'], ['٥. شاهد الحاويات', 'docker ps']],
      file: 'Dockerfile', ci: 'يبني الـ Workflow الصورة عند كل دمج ويدفعها إلى ghcr.io/alaabashirsaijary/devops بوسم رقم الـ commit.' },
    { slug: 'terraform', name: 'Terraform', ar: '٥ · البنية', c: '#818cf8',
      d: 'نكتب البنية المطلوبة كملف (مثلًا namespace) وTerraform ينفّذها وينقل الواقع إلى ما كتبناه.',
      steps: [['حمّل المزوّد', 'terraform init'], ['اعرض ما سيتغير', 'terraform plan'], ['نفّذه', 'terraform apply']],
      file: 'terraform/main.tf', ci: 'في staging ينشئ Terraform الـ namespace باسم hello-devops داخل Cluster مؤقت.' },
    { slug: 'kubernetes', name: 'Kubernetes', ar: '٦ · النشر', c: '#4ade80',
      d: 'يشغّل 3 نسخ من الحاوية (Pods) ويفحص صحتها، وإن مات Pod ينشئ بديلًا فورًا.',
      steps: [['انشر', 'kubectl apply -f k8s/'], ['شاهد الـ Pods', 'kubectl get pods -n hello-devops'], ['جرّب الشفاء الذاتي', 'kubectl delete pod <اسم> -n hello-devops'], ['كبّر العدد', 'kubectl scale deployment/hello --replicas=5 -n hello-devops'], ['تراجع عن نسخة', 'kubectl rollout undo deployment/hello -n hello-devops']],
      file: 'k8s/deployment.yaml', ci: 'يُنفَّذ كل هذا فعلًا في staging: 3 نسخ ثم 5، وحذف Pod وانتظار عودته.' },
    { slug: 'ansible', name: 'Ansible', ar: '٧ · التهيئة', c: '#f87171',
      d: 'يجهّز خادمًا بخطوات مكتوبة في playbook، وإعادة التشغيل لا تغيّر شيئًا إن كان كل شيء جاهزًا.',
      steps: [['شغّل الـ playbook', 'ansible-playbook -i inventory.ini playbook.yml'], ['شغّله مرة ثانية', '# النتيجة: changed=0  (Idempotent)']],
      file: 'ansible/playbook.yml', ci: 'في staging يعمل مرتين، ويفشل الـ pipeline إن لم تكن الثانية changed=0.' },
    { slug: 'prometheus', name: 'Prometheus', ar: '٨ · المراقبة', c: '#2dd4bf',
      d: 'يسحب أرقام التطبيق من /metrics كل بضع ثوانٍ، وينبّه إذا توقف.',
      steps: [['شغّل المراقبة', 'docker compose -f docker-compose.monitoring.yml up -d'], ['استعلم عن الزيارات', 'http_requests_total   # http://localhost:9090'], ['اختبر التنبيه', 'أوقف التطبيق وانتظر دقيقة ← AppDown']],
      file: 'monitoring/alerts.yml', ci: 'في staging يتأكد الـ pipeline أن up{job="hello"} = 1 وأن قاعدة AppDown محمّلة.' },
  ];
  const ICON_URL = (s) => 'https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/' + s + '.svg';

  // simple-icons are single-colour SVGs: fetch, paint them, and use as data URLs (works for canvas too)
  const icons = {};
  TOOLS.forEach((t) => {
    icons[t.slug] = fetch(ICON_URL(t.slug)).then((r) => r.text())
      .then((svg) => 'data:image/svg+xml;utf8,' + encodeURIComponent(svg.replace('<svg', '<svg fill="' + t.c + '"')))
      .catch(() => null);
  });

  const info = document.getElementById('info'), nav = document.getElementById('tools');
  const iLogo = document.getElementById('i-logo');
  let selected = -1, onSelect = () => {};
  function select(i) {
    selected = i;
    const t = TOOLS[i];
    info.style.setProperty('--tool', t.c);
    document.getElementById('i-step').textContent = t.ar;
    document.getElementById('i-name').textContent = t.name;
    document.getElementById('i-desc').textContent = t.d;
    const st = document.getElementById('i-steps'); st.textContent = '';
    t.steps.forEach(([cap, cmd]) => {
      const li = document.createElement('li'), c = document.createElement('span'), k = document.createElement('code');
      c.textContent = cap; k.textContent = cmd; li.append(c, k); st.appendChild(li);
    });
    document.getElementById('i-ci').textContent = t.ci;
    document.getElementById('i-file').href = REPO + t.file;
    document.getElementById('i-file').textContent = t.file;
    info.scrollTop = 0;
    iLogo.removeAttribute('src');
    icons[t.slug].then((u) => { if (selected === i && u) iLogo.src = u; });
    info.hidden = false;
    [...nav.children].forEach((b, k) => b.classList.toggle('on', k === i));
    nav.style.setProperty('--tool', t.c);
    onSelect(i);
  }
  function clear() { selected = -1; info.hidden = true; [...nav.children].forEach((b) => b.classList.remove('on')); onSelect(-1); }
  document.getElementById('close').onclick = clear;
  TOOLS.forEach((t, i) => {
    const b = document.createElement('button');
    b.title = t.name; b.setAttribute('aria-label', t.name);
    b.style.setProperty('--tool', t.c);
    const im = document.createElement('img'); im.alt = ''; b.appendChild(im);
    icons[t.slug].then((u) => { if (u) im.src = u; else b.textContent = t.name[0]; });
    b.onclick = () => (selected === i ? clear() : select(i));
    nav.appendChild(b);
  });

  // ---- 3D factory ----
  const box = document.getElementById('scene');
  if (!window.THREE) return;
  const GAP = 4, X0 = -14, START = -17.5, END = 17.5, SPEED = 2.2;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const speed = reduced ? SPEED * 0.25 : SPEED;
  const hex = (s) => parseInt(s.slice(1), 16);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  box.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1220);
  scene.fog = new THREE.Fog(0x0b1220, 32, 75);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
  scene.add(new THREE.AmbientLight(0xffffff, 0.95));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(-8, 14, 10);
  scene.add(sun);
  scene.add(new THREE.GridHelper(70, 70, 0x334155, 0x1e293b));

  const mat = (c, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, extra));
  const add = (geo, m, x, y, z, parent) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); (parent || scene).add(o); return o; };

  add(new THREE.BoxGeometry(37, 0.3, 2), mat(0x1f2937), 0, 0.15, 0);
  const tickGeo = new THREE.BoxGeometry(0.12, 0.02, 1.8), tickMat = mat(0x475569);
  const ticks = [];
  for (let x = START; x <= END; x += 1.5) ticks.push(add(tickGeo, tickMat, x, 0.31, 0));

  // round badge sprite with the tool's logo; the logo is painted once it has loaded
  function badge(t) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 256;
    const g = cv.getContext('2d'), tex = new THREE.CanvasTexture(cv);
    const paint = (img) => {
      g.clearRect(0, 0, 256, 256);
      g.beginPath(); g.arc(128, 128, 118, 0, 7); g.fillStyle = '#0b1220'; g.fill();
      g.lineWidth = 12; g.strokeStyle = t.c; g.stroke();
      if (img) g.drawImage(img, 64, 64, 128, 128);
      else { g.fillStyle = t.c; g.font = 'bold 110px system-ui'; g.textAlign = 'center'; g.fillText(t.name[0], 128, 166); }
      tex.needsUpdate = true;
    };
    paint(null);
    icons[t.slug].then((u) => { if (!u) return; const im = new Image(); im.onload = () => paint(im); im.src = u; });
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sp.scale.set(2.6, 2.6, 1);
    return sp;
  }

  const stations = TOOLS.map((t, i) => {
    const x = X0 + i * GAP, g = new THREE.Group(), c = hex(t.c);
    g.position.x = x; scene.add(g);
    const m = mat(c, { emissive: c, emissiveIntensity: 0.15 });
    add(new THREE.BoxGeometry(0.45, 2.6, 0.45), m, 0, 1.3, 1.3, g);
    add(new THREE.BoxGeometry(0.45, 2.6, 0.45), m, 0, 1.3, -1.3, g);
    add(new THREE.BoxGeometry(0.45, 0.45, 3.2), m, 0, 2.7, 0, g);
    const lamp = add(new THREE.SphereGeometry(0.3, 16, 12), mat(c, { emissive: c, emissiveIntensity: 0.2 }), 0, 3.3, 0, g);
    const icon = badge(t); icon.position.set(0, 5.1, 0); icon.userData.i = i; g.add(icon);
    return { x, lamp, icon, level: 0.2, c };
  });
  const ring = add(new THREE.TorusGeometry(0.8, 0.07, 8, 32), mat(hex(TOOLS[7].c), { emissive: hex(TOOLS[7].c), emissiveIntensity: 0.6 }), stations[7].x, 3.3, 0);

  const pkgGeo = new THREE.BoxGeometry(1, 1, 1);
  let pkgs = [], spawn = 0;
  function spawnPkg() {
    const o = new THREE.Mesh(pkgGeo, mat(0xe2e8f0, { emissive: 0x000000 }));
    o.position.set(START, 0.8, 0); scene.add(o); pkgs.push(o);
  }
  onSelect = () => {};

  const target = new THREE.Color();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1); last = now;
    spawn -= dt; if (spawn <= 0) { spawnPkg(); spawn = 2.4; }
    const active = stations.map(() => 0);
    pkgs.forEach((p) => {
      p.position.x += speed * dt; p.rotation.y += dt * 0.6;
      let idx = -1; stations.forEach((s, i) => { if (p.position.x >= s.x) idx = i; });
      if (idx >= 0) {
        target.setHex(hex(TOOLS[idx].c)); p.material.color.lerp(target, 0.12);
        p.scale.lerp(idx >= 3 ? new THREE.Vector3(1.5, 0.9, 0.9) : new THREE.Vector3(0.9, 0.9, 0.9), 0.1);
      } else p.scale.set(0.9, 0.9, 0.9);
      stations.forEach((s, i) => { if (Math.abs(p.position.x - s.x) < 1.3) active[i] = 1; });
    });
    pkgs = pkgs.filter((p) => { if (p.position.x > END) { scene.remove(p); p.material.dispose(); return false; } return true; });
    stations.forEach((s, i) => {
      s.level += (active[i] * 1.6 + 0.2 - s.level) * 0.15; s.lamp.material.emissiveIntensity = s.level;
      const want = (i === selected ? 1.35 : 1) * (hovered === i ? 1.12 : 1) * 2.6;
      s.icon.scale.x += (want - s.icon.scale.x) * 0.2; s.icon.scale.y = s.icon.scale.x;
      s.icon.position.y = 5.1 + (i === selected ? Math.sin(now / 250) * 0.15 : 0);
    });
    ticks.forEach((t) => { t.position.x += speed * dt; if (t.position.x > END) t.position.x = START; });
    ring.rotation.x += dt * 1.5; ring.rotation.y += dt;
    place(); renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  let yaw = 0.35, pitch = 0.42, dist = 30, zoom = 1, drag = null, moved = false, hovered = -1;
  function place() {
    const d = dist * zoom;
    camera.position.set(Math.sin(yaw) * Math.cos(pitch) * d, Math.sin(pitch) * d + 1, Math.cos(yaw) * Math.cos(pitch) * d);
    camera.lookAt(0, 2.5, 0);
  }
  function resize() {
    const w = box.clientWidth, h = box.clientHeight;
    renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
    const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2) * camera.aspect);
    const narrow = camera.aspect < 1.2;
    if (!moved) yaw = narrow ? 0.9 : 0.35;
    dist = Math.max(22, (narrow ? 17 : 15) / Math.tan(hfov / 2));
  }

  // picking: a tap (not a drag) on a station icon selects it
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function pick(e) {
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(mouse, camera);
    const hit = ray.intersectObjects(stations.map((s) => s.icon))[0];
    return hit ? hit.object.userData.i : -1;
  }
  const cv = renderer.domElement;
  let downAt = null;
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; downAt = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => {
    if (!drag) { hovered = pick(e); cv.style.cursor = hovered >= 0 ? 'pointer' : 'grab'; return; }
    if (Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 5) moved = true;
    yaw -= (e.clientX - drag.x) * 0.006; pitch = Math.min(1.3, Math.max(0.1, pitch + (e.clientY - drag.y) * 0.004));
    drag = { x: e.clientX, y: e.clientY };
  });
  cv.addEventListener('pointerup', (e) => {
    const tap = downAt && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) <= 5;
    drag = null;
    if (tap) { const i = pick(e); if (i >= 0) select(i); else clear(); }
  });
  cv.addEventListener('pointercancel', () => { drag = null; });
  cv.addEventListener('wheel', (e) => { e.preventDefault(); zoom = Math.min(1.6, Math.max(0.5, zoom + e.deltaY * 0.001)); }, { passive: false });
  addEventListener('resize', resize);
  resize();
  for (let x = START; x < 6; x += 2.4 * speed) { spawnPkg(); pkgs[pkgs.length - 1].position.x = x; }
  requestAnimationFrame(frame);
})();
</script>
<script>
  const $ = (id) => document.getElementById(id);
  // On GitHub Pages there is no Node server, so show a static view instead of "down".
  const isStatic = location.hostname.endsWith('.github.io');
  async function refresh() {
    if (isStatic) {
      $('env').textContent = 'live (الإنتاج)'; $('dot').className = 'dot ok';
      $('deck-link').hidden = false;
      return;
    }
    try {
      const h = await (await fetch('/health')).json();
      const i = await (await fetch('/api/info')).json();
      $('env').textContent = i.environment + ' · ' + i.hostname;
      $('dot').className = 'dot ' + (h.status === 'ok' ? 'ok' : 'bad');
    } catch (e) {
      $('env').textContent = 'down'; $('dot').className = 'dot bad';
    }
  }
  refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
