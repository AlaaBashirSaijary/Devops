name: CI-CD

# test -> build image -> STAGING (test environment, ephemeral Kubernetes) -> LIVE (GitHub Pages)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

  # Test environment: a throw-away Kubernetes cluster (kind) created on the runner.
  staging:
    name: staging (test environment)
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      IMAGE: ghcr.io/alaabashirsaijary/devops:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform - create the namespace
        working-directory: terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Kubernetes - deploy this commit's image
        run: |
          sed "s#ghcr.io/alaabashirsaijary/devops:latest#${IMAGE}#" k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl -n hello-devops rollout status deployment/hello --timeout=180s
          kubectl -n hello-devops get pods

      - name: Smoke test the staging site
        run: |
          kubectl -n hello-devops port-forward svc/hello 8080:80 &
          sleep 5
          curl -fsS localhost:8080/health
          curl -fsS localhost:8080/api/info | tee info.json
          grep -q '"environment":"staging"' info.json
          curl -fsS localhost:8080/ | grep -q "Hello DevOps"

      - name: Operate - scale to 5 and self-heal after deleting a pod
        run: |
          kubectl -n hello-devops scale deployment/hello --replicas=5
          kubectl -n hello-devops rollout status deployment/hello --timeout=120s
          kubectl -n hello-devops delete "$(kubectl -n hello-devops get pod -l app=hello -o name | head -1)"
          kubectl -n hello-devops rollout status deployment/hello --timeout=120s
          test "$(kubectl -n hello-devops get deployment hello -o jsonpath='{.status.readyReplicas}')" = "5"

      - name: Ansible - configure a server (run twice to prove idempotency)
        run: |
          python3 -m venv /tmp/av
          /tmp/av/bin/pip install -q ansible docker requests
          /tmp/av/bin/ansible-galaxy collection install community.docker
          cd ansible
          for i in 1 2; do
            /tmp/av/bin/ansible-playbook -i inventory.ini playbook.yml \
              -e install_docker=false -e ansible_python_interpreter=/tmp/av/bin/python | tee run$i.log
          done
          grep -q "changed=0" run2.log
          curl -fsS localhost:3000/health

      - name: Monitor - Prometheus scrapes the app and loads the alert rule
        run: |
          mkdir /tmp/prom
          cp monitoring/alerts.yml /tmp/prom/
          sed 's#host.docker.internal:3000#localhost:3000#' monitoring/prometheus.yml > /tmp/prom/prometheus.yml
          docker run -d --name prom --network host -v /tmp/prom:/etc/prometheus prom/prometheus
          v=""
          for i in $(seq 1 30); do
            v=$(curl -s 'localhost:9090/api/v1/query?query=up%7Bjob%3D%22hello%22%7D' \
              | python3 -c 'import sys,json; r=json.load(sys.stdin)["data"]["result"]; print(r[0]["value"][1] if r else "")' || true)
            [ "$v" = "1" ] && break
            sleep 2
          done
          test "$v" = "1"
          curl -s localhost:9090/api/v1/rules | grep -q AppDown

      - name: Summary
        run: |
          {
            echo "### Staging passed"
            echo "- Terraform created the namespace"
            echo "- Kubernetes ran 3 replicas of \`${IMAGE}\`, scaled to 5 and self-healed"
            echo "- Ansible configured the server twice (second run: changed=0)"
            echo "- Prometheus scraped the app and loaded the AppDown alert"
          } >> "$GITHUB_STEP_SUMMARY"

  # Live: published only after staging passed.
  pages:
    name: live (GitHub Pages)
    needs: staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/presentation
          cp app/index.html _site/index.html
          cp presentation/index.html _site/presentation/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
